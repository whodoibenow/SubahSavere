name: Fetch Daily Briefings

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest newsletter issues
        run: node scripts/fetch-briefings.mjs
      - name: Commit updated briefings.json
        run: |
          git config user.name "today-bot"
          git config user.email "today-bot@users.noreply.github.com"
          git add briefings.json
          git diff --staged --quiet || git commit -m "chore: update morning briefings"
          git push
